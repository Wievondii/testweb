<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小肥画展</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="css/style.css?v=14">
  <link rel="stylesheet" href="css/animations.css?v=3">
</head>
<body>

  <!-- Film grain overlay -->
  <div class="grain-overlay"></div>

  <!-- Header -->
  <header class="site-header" id="header">
    <a href="#" class="site-logo">
      <span class="logo-mark">小肥</span><span class="logo-light">画展</span>
    </a>
    <nav class="header-nav">
      <a href="#gallery">画廊</a>
      <span class="nav-divider"></span>
      <a href="admin.html">管理</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero" id="home">
    <canvas id="threeCanvas"></canvas>
    <div class="hero-bg-lines"></div>
    <!-- 印象派装饰性光晕 -->
    <div class="hero-deco-orb hero-deco-orb--left"></div>
    <div class="hero-deco-orb hero-deco-orb--right"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">一场印象派的视觉之旅</p>
      <h1 class="hero-title" id="heroTitle">小肥画展</h1>
      <div class="hero-rule"></div>
      <p class="hero-subtitle" id="heroSubtitle">用光影定格每一个诗意瞬间</p>
    </div>
    <div class="hero-scroll-hint">
      <span>向下滑动，探索花园</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- Filters -->
  <section class="filters-section" id="filtersSection">
    <div class="filters-inner">
      <div class="category-filter" id="categoryFilter">
        <button type="button" class="filter-pill active" data-cat="all">
          <span class="pill-label">全部作品</span>
        </button>
        <button type="button" class="filter-pill" data-cat="人像">
          <span class="pill-label">人像</span>
          <span class="pill-count" data-count-cat="人像"></span>
        </button>
        <button type="button" class="filter-pill" data-cat="花草">
          <span class="pill-label">花草</span>
          <span class="pill-count" data-count-cat="花草"></span>
        </button>
        <button type="button" class="filter-pill" data-cat="城市风景">
          <span class="pill-label">城市风景</span>
          <span class="pill-count" data-count-cat="城市风景"></span>
        </button>
        <button type="button" class="filter-pill" data-cat="其他">
          <span class="pill-label">其他</span>
          <span class="pill-count" data-count-cat="其他"></span>
        </button>
      </div>
      <div class="tag-filter" id="tagFilter"></div>
    </div>
  </section>

  <!-- Gallery -->
  <section class="gallery" id="gallery">
    <div class="gallery-count" id="galleryCount"></div>
    <!-- 任务2.1：加载进度指示器 -->
    <div class="load-progress" id="loadProgress" style="display:none;">
      <div class="load-progress-bar"><div class="load-progress-fill"></div></div>
      <span class="load-progress-text" id="loadProgressText">加载中...</span>
    </div>
    <div class="masonry" id="masonry"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">
        <svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="8" y="8" width="64" height="64" rx="2"/>
          <circle cx="28" cy="28" r="6"/>
          <path d="M8 56l18-18 14 14 10-10 22 18"/>
        </svg>
      </div>
      <h3>暂无作品</h3>
      <p>通过管理面板添加照片后，作品将显示在这里。</p>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop"></div>
    <span class="lightbox-counter" id="lbCounter"></span>
    <button type="button" class="lightbox-close" id="lbClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lbPrev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="lightbox-nav lightbox-next" id="lbNext">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
    <div class="lightbox-img-wrap">
      <img class="lightbox-img" id="lbImg" src="" alt="画廊大图">
    </div>
    <div class="lightbox-info">
      <h3 id="lbTitle"></h3>
      <p id="lbDesc"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-decoration">
      <svg viewBox="0 0 120 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="footer-flourish">
        <path d="M60 2C45 2 30 8 20 14C30 12 45 10 60 10C75 10 90 12 100 14C90 8 75 2 60 2Z" fill="url(#footerGrad)" opacity="0.3"/>
        <circle cx="60" cy="12" r="3" fill="var(--accent-soft)" opacity="0.5"/>
        <circle cx="45" cy="10" r="1.5" fill="var(--monet-rose)" opacity="0.4"/>
        <circle cx="75" cy="10" r="1.5" fill="var(--monet-lavender)" opacity="0.4"/>
        <defs>
          <linearGradient id="footerGrad" x1="20" y1="2" x2="100" y2="14">
            <stop offset="0%" stop-color="var(--monet-rose)" stop-opacity="0.4"/>
            <stop offset="50%" stop-color="var(--accent-soft)" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="var(--monet-lavender)" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="footer-rule"></div>
    <p class="footer-text">&copy; 小肥画展 · 用光影书写诗意</p>
    <p class="footer-subtext">Impressionist Garden Gallery</p>
  </footer>

  <!-- 任务3.5：Scroll-to-top 按钮 -->
  <button type="button" class="scroll-top-btn" id="scrollTopBtn" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script src="js/compressor.js?v=2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/three-bg.js?v=3"></script>
  <script src="js/main.js?v=13"></script>
</body>
</html>
